cucumber.glue=ru.test.weather.steps
cucumber.plugin=pretty, io.qameta.allure.cucumber7jvm.AllureCucumber7Jvm, html:build/reports/cucumber/cucumber.html
cucumber.publish.quiet=true
# Сценарии с заведомо неверными ожиданиями (демонстрация вывода расхождений) по умолчанию не запускаются.
# Запуск всех сценариев вместе с ними: ./gradlew test -Dcucumber.filter.tags="@weather"
cucumber.filter.tags=not @mismatch
